name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb x11-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean, lockfile-based)
        run: npm ci

      - name: Dependency audit (critical findings fail CI)
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Verify display environment
        run: xvfb-run -a sh -c 'echo "DISPLAY=$DISPLAY"; xdpyinfo | head -3'

      - name: Playwright E2E tests
        run: |
          echo "DISPLAY=$DISPLAY"
          xdpyinfo | head -3 || echo "xdpyinfo failed"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" sh -c 'echo "inside: DISPLAY=$DISPLAY"; xdpyinfo | head -2; npm run test:e2e'
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
